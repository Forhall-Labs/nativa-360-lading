name: CI/CD

# Este repo se actualiza desde Forhall-Labs/nativa-360-central (trunk-based:
# solo main). No recibe PRs ni pushes directos: el sync del central pushea a
# main y dispara este workflow con el ambiente que diga el feature flag
# deploy-flags.json del central — dev → Vercel Preview, prod → Production.
# Los quality gates (CI, Snyk, SonarQube Cloud, PR score) corren en los PRs
# del central; acá se repiten los checks como última barrera antes del deploy.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Ambiente destino
        type: choice
        options: [dev, prod]
        required: true
      sha:
        description: Commit de main a desplegar
        type: string
        required: true

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Format, spell, lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Spell check
        run: npm run spell

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build (includes type-check)
        run: npm run build
        env:
          # Placeholders para que el build no falle evaluando createClient()
          # en build time — el deploy real usa las env vars del proyecto en
          # Vercel.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_API_URL: http://localhost:3001

  deploy:
    name: Deploy (${{ inputs.target }})
    needs: checks
    runs-on: ubuntu-latest
    environment: ${{ inputs.target == 'prod' && 'production' || 'preview' }}
    env:
      VERCEL_TARGET: ${{ inputs.target == 'prod' && 'production' || 'preview' }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Check Vercel secrets are configured
        id: secrets_check
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::One or more Vercel secrets are missing — skipping deploy."
            echo "missing=1" >> "$GITHUB_OUTPUT"
          else
            echo "missing=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        if: steps.secrets_check.outputs.missing == '0'
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        if: steps.secrets_check.outputs.missing == '0'
        run: vercel pull --yes --environment="$VERCEL_TARGET" --token="$VERCEL_TOKEN"

      - name: Build with Vercel
        if: steps.secrets_check.outputs.missing == '0'
        run: vercel build --target="$VERCEL_TARGET" --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        id: deploy
        if: steps.secrets_check.outputs.missing == '0'
        run: |
          url=$(vercel deploy --prebuilt --target="$VERCEL_TARGET" --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: steps.secrets_check.outputs.missing == '0'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ inputs.sha }}
        run: |
          echo "### Deployed \`${SHA::7}\` to \`$VERCEL_TARGET\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
